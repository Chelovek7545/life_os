name: life_os
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0


workspace:
  - packages/tasks_api
  - packages/plugin_runtime
  - packages/telegram_plugin
  - packages/spheres_api
  - packages/goals_api
  - packages/graph_api
  - packages/graph_ui
  - packages/notes_api
  - packages/obsidian_plugin
  - packages/plugin_ui

dependencies:
  spheres_api: ^0.1.0
  goals_api: ^0.1.0
  graph_api: ^0.1.0
  graph_ui: ^0.1.0
  notes_api: ^0.1.0
  obsidian_plugin: ^0.1.0
  plugin_ui: ^0.1.0
  tasks_api: ^0.1.0
  plugin_runtime: ^0.1.0
  telegram_plugin: ^0.1.0
  flutter:
    sdk: flutter
  rxdart: ^0.28.0

  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.0
  path: ^1.8.0
 


  cupertino_icons: ^1.0.8
  uuid: ^4.5.3
  collection: ^1.19.1
  shared_preferences: ^2.5.5
  teledart: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.33.0
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  test: ^1.25.5

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: fonts\Inter-VariableFont_opsz,wght.ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts\JetBrainsMono-VariableFont_wght.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: fonts\SpaceGrotesk-VariableFont_wght.ttf
  
